# =====================================================================
# Aletheia — packaging metadata (PEP 621)
# =====================================================================
# Build:  pip install -e .              # editable install + console script
#         pip install .[full]           # adds PDF report export
#         pip install .[dev]            # adds pytest
# =====================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia"
version = "1.0.1"
description = "Quality-control pipeline for untargeted LC–MS metabolomics and lipidomics — per-feature linearity, two-tier replicate diagnostic, multi-format input."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "metabolomics",
    "lipidomics",
    "lc-ms",
    "mass-spectrometry",
    "quality-control",
    "qc-dilution-series",
    "linearity-assessment",
    "replicate-diagnostic",
    "bruker-metaboscape",
    "mzmine",
    "xcms",
    "ms-dial",
    "dash",
    "reproducible-research",
]
authors = [
    { name = "Ángela Peralbo-Molina", email = "angela.peralbo@imibic.org" },
    { name = "Cristina López-Vázquez" },
    { name = "Ana Salinas-Gavilán" },
    { name = "Eduardo Chicano-Gálvez" },
]
maintainers = [
    { name = "Ángela Peralbo-Molina", email = "angela.peralbo@imibic.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Framework :: Dash",
]

# Required runtime dependencies — everything the CLI + Dash UI need to run
# without any optional report-generation features.
dependencies = [
    "dash>=2.14",
    "plotly>=5.18",
    "flask>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# `pip install aletheia[full]` — adds the PDF run-report export of the web UI
# (the CLI and the analysis itself do not need it).
full = [
    "reportlab>=4.0",          # PDF rendering of Aletheia run reports
    "svglib>=1.5",             # SVG → PDF conversion of the Plotly figures
    "kaleido>=1.0",            # Plotly static-image export (needs Chrome/Chromium)
]
# Dev tooling — tests, linting, type-checking.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage      = "https://github.com/aperalbom/Aletheia"
Repository    = "https://github.com/aperalbom/Aletheia"
Issues        = "https://github.com/aperalbom/Aletheia/issues"
Documentation = "https://github.com/aperalbom/Aletheia#readme"

# Console script entry point — installs `aletheia` on the user's PATH.
[project.scripts]
aletheia = "sol_analyzer_dash.cli:main"

# ---------------------------------------------------------------------
# setuptools — package discovery
# ---------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sol_analyzer_dash*"]
exclude = ["sol_analyzer_dash.tests*"]

# ---------------------------------------------------------------------
# pytest — test discovery configuration
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["sol_analyzer_dash/tests"]
python_files = ["test_*.py"]
addopts      = "-q"
